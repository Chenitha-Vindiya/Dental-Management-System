<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraDent - Secure Access</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        /* Keeping your exact premium glassmorphism variables */
        :root {
            --bg-gradient: linear-gradient(135deg, #f9f9ff 0%, #e7eeff 50%, #d8e3fb 100%);
            --primary-color: #005ab7;
            --primary-hover: #0072e5;
            --text-color: #111c2d;
            --text-muted: #414754;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --input-bg: rgba(255, 255, 255, 0.9);
            --shadow-ambient: 0 20px 50px -10px rgba(0, 90, 183, 0.15);
            --transition-speed: 0.3s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-gradient); color: var(--text-color); position: relative; overflow: hidden; padding: 16px; }

        .ambient-orb { position: absolute; border-radius: 50%; filter: blur(80px); z-index: -1; }
        .orb-1 { width: 400px; height: 400px; background: rgba(0, 90, 183, 0.2); top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: rgba(109, 144, 255, 0.15); bottom: -150px; right: -100px; }

        .auth-wrapper {
            background: var(--glass-bg); backdrop-filter: blur(24px); border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-ambient); border-radius: 32px; width: 100%; max-width: 440px;
            padding: 48px; position: relative; overflow: hidden; text-align: center;
        }

        .brand { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--primary-color); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .auth-header p { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }

        .step-container { display: none; animation: fadeIn 0.4s ease forwards; text-align: left; }
        .step-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-color); margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper .material-symbols-outlined { position: absolute; left: 16px; color: var(--text-muted); font-size: 20px; pointer-events: none; }

        .input-wrapper input {
            width: 100%; padding: 14px 16px 14px 48px; background: var(--input-bg); border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 16px; font-size: 15px; color: var(--text-color); transition: all 0.3s;
        }
        .input-wrapper input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(0, 90, 183, 0.1); }
        .input-wrapper input:focus + .material-symbols-outlined { color: var(--primary-color); }

        .submit-btn {
            width: 100%; background: var(--primary-color); color: #ffffff; border: none; padding: 16px;
            border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px;
        }
        .submit-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 90, 183, 0.2); }

        .error-message { color: #dc2626; font-size: 13px; text-align: center; margin-top: 12px; display: none; }

        /* Social Logins */
        .social-divider {
            display: flex; align-items: center; text-align: center; margin: 32px 0 24px 0;
            color: var(--text-muted); font-size: 13px; font-weight: 500;
        }
        .social-divider::before, .social-divider::after {
            content: ''; flex: 1; border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .social-divider::before { margin-right: 16px; }
        .social-divider::after { margin-left: 16px; }

        .social-logins { display: flex; gap: 24px; justify-content: center; }

        .social-btn {
            width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            background: var(--input-bg); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 50%;
            cursor: pointer; transition: all var(--transition-speed); color: var(--text-color);
            text-decoration: none;
        }
        .social-btn:hover {
            background: #ffffff; border-color: var(--primary-color);
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0, 90, 183, 0.1);
        }
        .social-btn svg { width: 24px; height: 24px; }
    </style>
</head>
<body>

<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>

<div class="auth-wrapper">
    <div class="auth-header">
        <div class="brand">
            <span class="material-symbols-outlined icon-fill">qr_code_2</span>
            <span>AuraDent</span>
        </div>
        <p id="stepDescription">Enter your email to continue</p>
    </div>

    <!-- STEP 1: IDENTIFIER (EMAIL) -->
    <!-- STEP 1: IDENTIFIER (EMAIL) -->
    <div id="stepEmail" class="step-container active">
        <div class="input-group">
            <label>Email Address</label>
            <div class="input-wrapper">
                <input type="email" id="emailInput" placeholder="sarah@auradent.com" required>
                <span class="material-symbols-outlined">mail</span>
            </div>
        </div>
        <button class="submit-btn" onclick="checkEmail()">
            Continue <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div id="emailError" class="error-message"></div>

        <!-- Social Logins -->
        <div class="social-divider">Or continue with</div>
        <div class="social-logins">
            <a href="/oauth2/authorization/google" class="social-btn" aria-label="Sign in with Google">
                <svg viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </a>
            <a href="/oauth2/authorization/apple" class="social-btn" aria-label="Sign in with Apple">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.19 2.31-.88 3.5-.8 1.53.07 2.76.65 3.54 1.74-3.09 1.77-2.58 5.86.5 7.07-.68 1.67-1.61 3.25-2.62 4.16M12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.35 2.45-2.08 4.41-3.74 4.25"/>
                </svg>
            </a>
            <a href="/oauth2/authorization/microsoft" class="social-btn" aria-label="Sign in with Microsoft">
                <svg viewBox="0 0 24 24">
                    <path fill="#f35325" d="M2 2h9.5v9.5H2z"/>
                    <path fill="#81bc06" d="M12.5 2H22v9.5h-9.5z"/>
                    <path fill="#05a6f0" d="M2 12.5h9.5V22H2z"/>
                    <path fill="#ffba08" d="M12.5 12.5H22V22h-9.5z"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- STEP 2A: LOGIN (PASSWORD) -->
    <div id="stepPassword" class="step-container">
        <div class="input-group">
            <label>Welcome back, enter your password</label>
            <div class="input-wrapper">
                <input type="password" id="loginPassword" placeholder="••••••••">
                <span class="material-symbols-outlined">lock</span>
            </div>
        </div>
        <button class="submit-btn" onclick="submitLogin()">
            Log In <span class="material-symbols-outlined">login</span>
        </button>
    </div>

    <!-- STEP 2B: OTP VERIFICATION -->
    <div id="stepOtp" class="step-container">
        <div class="input-group">
            <label>Enter the 6-digit code sent to your email</label>
            <div class="input-wrapper">
                <input type="text" id="otpInput" placeholder="123456" maxlength="6" style="letter-spacing: 4px; text-align: center; padding-left: 16px;">
            </div>
        </div>
        <button class="submit-btn" onclick="verifyOtp()">
            Verify Code <span class="material-symbols-outlined">check_circle</span>
        </button>
        <div id="otpError" class="error-message"></div>
    </div>

    <!-- STEP 3: REGISTRATION DETAILS -->
    <div id="stepDetails" class="step-container">

        <div class="input-group">
            <label>Full Name</label>
            <div class="input-wrapper">
                <input type="text" id="regName" placeholder="John Doe">
                <span class="material-symbols-outlined">person</span>
            </div>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <div class="input-wrapper">
                <input type="tel" id="regPhone" placeholder="+94 77 123 4567">
                <span class="material-symbols-outlined">call</span>
            </div>
        </div>

        <div class="input-group">
            <label>Date of Birth</label>
            <div class="input-wrapper">
                <!-- The date input automatically shows a calendar picker -->
                <input type="date" id="regDob" style="padding-left: 16px;">
            </div>
        </div>

        <div class="input-group">
            <label>Create Password</label>
            <div class="input-wrapper">
                <input type="password" id="regPassword" placeholder="Strong password">
                <span class="material-symbols-outlined">lock</span>
            </div>
        </div>

        <button class="submit-btn" onclick="completeRegistration()">
            Create Account <span class="material-symbols-outlined">person_add</span>
        </button>
    </div>
</div>

<script>
    let currentEmail = "";

    function showStep(stepId, titleText) {
        document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
        document.getElementById('stepDescription').innerText = titleText;
    }

    async function checkEmail() {
        const email = document.getElementById('emailInput').value;
        if(!email) return;
        currentEmail = email;

        const response = await fetch('/api/auth/check-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        if (data.status === 'EXISTS') {
            showStep('stepPassword', 'Sign in to your account');
        } else if (data.status === 'NEW_USER') {
            showStep('stepOtp', 'Verify your email address');
        }
    }

    async function verifyOtp() {
        const otp = document.getElementById('otpInput').value;
        const errorDiv = document.getElementById('otpError');

        const response = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentEmail, otp: otp })
        });

        if (response.ok) {
            errorDiv.style.display = 'none';
            showStep('stepDetails', 'Complete your profile setup');
        } else {
            errorDiv.innerText = "Invalid or expired OTP code.";
            errorDiv.style.display = 'block';
        }
    }

    async function completeRegistration() {
        const fullName = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        const dob = document.getElementById('regDob').value;
        const password = document.getElementById('regPassword').value;

        if(!fullName || !phone || !dob || !password) {
            alert("Please fill in all fields to complete your registration.");
            return;
        }

        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: currentEmail,
                fullName: fullName,
                phoneNumber: phone,
                dateOfBirth: dob,
                password: password
            })
        });

        if (response.ok) {
            window.location.href = "/dashboard";
        } else {
            alert("An error occurred during registration. Please try again.");
        }
    }

    function submitLogin() {
        alert("Proceeding to authentication with standard login logic...");
    }
</script>
</body>
</html>
