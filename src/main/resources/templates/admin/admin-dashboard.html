<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraDent - Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/admin/admin-sidebar.css}">
<!--    <script th:src="@{/js/admin/admin-sidebar.js}" defer></script>-->


    <style>
        /* Main Content */
        .main-content {
            flex-grow: 1;
            padding: 48px;
            overflow-y: auto;
            height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
        }

        /* Stat Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-ambient);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            background: rgba(0, 90, 183, 0.1);
            color: var(--primary-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info h3 {
            font-size: 24px;
            color: var(--text-color);
        }

        .stat-info p {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Data Table Section */
        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-ambient);
        }

        .table-container h2 {
            font-size: 20px;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 16px;
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        td {
            padding: 16px;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge.super-admin {
            background: #e0e7ff;
            color: #3730a3;
        }

        .badge.admin {
            background: #dcfce7;
            color: #166534;
        }

        .badge.receptionist {
            background: #fef9c3;
            color: #854d0e;
        }
    </style>
</head>
<body>

<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>

<div th:replace="~{admin/fragments/sidebar :: admin-sidebar}"></div>

<!-- Main Content -->
<main class="main-content">
    <div class="header">
        <div>
            <h1>System Overview</h1>
            <p style="color: var(--text-muted); margin-top: 4px;">Welcome back to the AuraDent admin portal.</p>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><span class="material-symbols-outlined">group</span></div>
            <div class="stat-info">
                <h3>1,248</h3>
                <p>Total Patients</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><span class="material-symbols-outlined">event_available</span></div>
            <div class="stat-info">
                <h3>42</h3>
                <p>Appointments Today</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><span class="material-symbols-outlined">payments</span></div>
            <div class="stat-info">
                <h3>$4,200</h3>
                <p>Daily Revenue</p>
            </div>
        </div>
    </div>

    <!-- Admins Table -->
    <div class="table-container">
        <h2>Authorized Administrators</h2>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <!-- th:each loops through the list of admins passed from the controller -->
            <tr th:each="admin : ${admins}">
                <!-- Display Name and Email -->
                <td th:text="${admin.fullName}">Admin Name</td>
                <td th:text="${admin.email}">admin@admin.com</td>

                <!-- Dynamic Role Badge -->
                <td>
                            <span class="badge"
                                  th:classappend="${#strings.toLowerCase(#strings.replace(admin.role, '_', '-'))}"
                                  th:text="${#strings.replace(admin.role, '_', ' ')}">ROLE
                            </span>
                </td>

                <!-- Dynamic Active/Inactive Status -->
                <td>
                    <span th:if="${admin.active}" style="color: #166534; font-weight: 700;">Active</span>
                    <span th:unless="${admin.active}" style="color: #dc2626; font-weight: 700;">Inactive</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
