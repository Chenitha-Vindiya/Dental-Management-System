<!-- Sidebar -->
<aside class="sidebar" id="mainSidebar" th:fragment="admin-sidebar">
    <div class="brand">
        <!-- Interactive icon wrapper that swaps to 'menu' on hover -->
        <div class="brand-icon-wrapper" onclick="toggleSidebar()" title="Expand/Collapse Menu">
            <span class="material-symbols-outlined default-icon">qr_code_2</span>
            <span class="material-symbols-outlined hover-icon">menu</span>
        </div>
        <a th:href="@{/admin/dashboard}" class="brand-text" style="text-decoration: none">AuraDent</a>
    </div>

    <nav class="nav-links">
        <a th:href="@{/admin/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
            <span class="material-symbols-outlined">dashboard</span>
            <span class="nav-text">Dashboard</span>
        </a>

        <a th:href="@{/admin/patients-management}" class="nav-item" th:classappend="${activePage == 'patients'} ? 'active' : ''">
            <span class="material-symbols-outlined">group</span>
            <span class="nav-text">Patients</span>
        </a>

        <a th:href="@{/admin/manage-dentists}" class="nav-item" th:classappend="${activePage == 'manage-dentists'} ? 'active' : ''">
            <span class="material-symbols-outlined">dentistry</span>
            <span class="nav-text">Dentists</span>
        </a>

        <a href="#" class="nav-item" th:classappend="${activePage == 'appointments'} ? 'active' : ''">
            <span class="material-symbols-outlined">calendar_month</span>
            <span class="nav-text">Appointments</span>
        </a>

        <a th:href="@{/admin/manage-admins}" class="nav-item" th:classappend="${activePage == 'manage-admins'} ? 'active' : ''">
            <span class="material-symbols-outlined">admin_panel_settings</span>
            <span class="nav-text">Admins</span>
        </a>

        <a href="#" class="nav-item" th:classappend="${activePage == 'settings'} ? 'active' : ''">
            <span class="material-symbols-outlined">settings</span>
            <span class="nav-text">Settings</span>
        </a>
    </nav>

    <!-- Bottom Actions Wrapper (Profile + Logout) -->
    <div class="sidebar-bottom-actions">
        <!-- Profile Button -->
        <a th:href="@{/admin/profile}" class="profile-btn" th:classappend="${activePage == 'profile'} ? 'active' : ''">
            <div class="avatar" th:text="${admin != null ? #strings.substring(admin.fullName, 0, 1) : 'A'}">A</div>
            <div class="profile-info nav-text">
                <span class="profile-name" th:text="${admin != null ? admin.fullName : 'Admin User'}">Admin User</span>
                <span class="profile-role">Admin Profile</span>
            </div>
        </a>

        <!-- Logout Button -->
        <a href="/logout" class="nav-item logout">
            <span class="material-symbols-outlined">logout</span>
            <span class="nav-text">Log Out</span>
        </a>
    </div>

    <!-- INLINE SCRIPT: Runs instantly to prevent flickering -->
    <script>
        if (localStorage.getItem("sidebar-collapsed") === "true") {
            document.getElementById('mainSidebar').classList.add('collapsed');
        }

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('mainSidebar');
            sidebar.classList.toggle('collapsed');

            if (sidebar.classList.contains('collapsed')) {
                localStorage.setItem("sidebar-collapsed", "true");
            } else {
                localStorage.setItem("sidebar-collapsed", "false");
            }
        };
    </script>
</aside>
